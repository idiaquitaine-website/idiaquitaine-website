<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page non trouvée | IDI Aquitaine</title>
  <meta name="description" content="La page que vous cherchez n'existe pas. Retournez à l'accueil ou contactez-nous." />
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --dark: #1c1c1c; --text: #2a2a2a; --muted: #6b6b6b; --red: #d91a0e; --bg: #f5f4f0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    a { color: var(--red); text-decoration: none; }
    .container { max-width: 600px; margin: 60px auto; padding: 40px 24px; text-align: center; }
    h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 3.2rem; font-weight: 800; color: var(--dark); margin-bottom: 16px; }
    p { font-size: 1.05rem; color: var(--muted); margin-bottom: 24px; }
    .btn { display: inline-block; background: var(--red); color: #fff; padding: 14px 32px; border-radius: 50px; font-weight: 600; transition: opacity .2s; }
    .btn:hover { opacity: .85; }
    .nav-logo { margin-bottom: 40px; }
    .nav-logo img { height: 50px; width: auto; }
  </style>
</head>
<body>

<div class="container">
  <div class="nav-logo">
    <img src="logo_transparent.png" alt="IDI Aquitaine" />
  </div>

  <h1>404</h1>
  <p>Désolé, la page que vous cherchez n'existe pas ou a été supprimée.</p>

  <div style="margin-bottom: 32px;">
    <a href="/" class="btn">Retourner à l'accueil</a>
  </div>

  <div style="margin-top: 48px; padding-top: 24px; border-top: 1px solid rgba(0,0,0,.1);">
    <p style="font-size: 0.9rem; margin-bottom: 12px;">Besoin d'aide ?</p>
    <ul style="list-style: none; display: flex; justify-content: center; gap: 24px; flex-wrap: wrap;">
      <li><a href="/">Accueil</a></li>
      <li><a href="/blog.html">Blog</a></li>
      <li><a href="/#contact">Contact</a></li>
    </ul>
  </div>
</div>

</body>
</html>
