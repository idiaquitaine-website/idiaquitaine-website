<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Formspree – IDI Aquitaine</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f5f4f0; color: #2a2a2a; padding: 40px 24px; }
    .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,.07); }
    h1 { margin-bottom: 10px; color: #d91a0e; }
    .info { background: rgba(217,26,14,.1); padding: 16px; border-radius: 8px; margin: 20px 0; font-size: .9rem; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; }
    input, textarea { width: 100%; padding: 12px; border: 1px solid rgba(0,0,0,.09); border-radius: 8px; font-family: inherit; }
    textarea { resize: vertical; min-height: 120px; }
    button { background: #d91a0e; color: #fff; padding: 12px 28px; border: none; border-radius: 50px; font-weight: 600; cursor: pointer; transition: opacity .2s; }
    button:hover { opacity: .85; }
    .success { background: rgba(46,125,50,.1); color: #2e7d32; padding: 16px; border-radius: 8px; margin-top: 20px; display: none; }
    .error { background: rgba(217,26,14,.1); color: #d91a0e; padding: 16px; border-radius: 8px; margin-top: 20px; display: none; }
  </style>
</head>
<body>

<div class="container">
  <h1>🧪 Test d'envoi Formspree</h1>
  <p>Testez l'intégration Formspree avant le déploiement sur Vercel</p>

  <div class="info">
    <strong>ℹ️ ID Formspree actuel :</strong> mojzrdvb<br>
    Remplacez cet ID par le vôtre depuis <a href="https://formspree.io" target="_blank">formspree.io</a>
  </div>

  <form id="testForm">
    <div class="form-group">
      <label>Prénom *</label>
      <input type="text" name="prenom" required>
    </div>
    <div class="form-group">
      <label>Nom *</label>
      <input type="text" name="nom" required>
    </div>
    <div class="form-group">
      <label>Email *</label>
      <input type="email" name="email" required>
    </div>
    <div class="form-group">
      <label>Téléphone</label>
      <input type="tel" name="telephone">
    </div>
    <div class="form-group">
      <label>Prestation *</label>
      <select name="prestation" required style="width:100%;padding:12px;border:1px solid rgba(0,0,0,.09);border-radius:8px;">
        <option value="">-- Choisir --</option>
        <option value="Diagnostic immobilier">Diagnostic immobilier</option>
        <option value="Infiltrométrie RT2012/RE2020">Infiltrométrie RT2012/RE2020</option>
        <option value="Recherche de fuite">Recherche de fuite</option>
      </select>
    </div>
    <div class="form-group">
      <label>Message *</label>
      <textarea name="message" required></textarea>
    </div>
    <button type="submit">Envoyer le test</button>
  </form>

  <div class="success" id="success">
    ✅ <strong>Email envoyé avec succès !</strong><br>
    Vous devriez recevoir une confirmation à votre adresse email.
  </div>
  <div class="error" id="error"></div>
</div>

<script>
  document.getElementById('testForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const formData = new FormData(e.target);
    const data = {
      prenom: formData.get('prenom'),
      nom: formData.get('nom'),
      email: formData.get('email'),
      telephone: formData.get('telephone'),
      prestation: formData.get('prestation'),
      message: formData.get('message')
    };

    try {
      // Envoyer via Formspree
      const response = await fetch('https://formspree.io/f/mojzrdvb', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      if (response.ok) {
        document.getElementById('success').style.display = 'block';
        document.getElementById('error').style.display = 'none';
        e.target.reset();
      } else {
        throw new Error('Erreur lors de l\'envoi');
      }
    } catch (err) {
      document.getElementById('error').style.display = 'block';
      document.getElementById('error').textContent = '❌ Erreur : ' + err.message;
      document.getElementById('success').style.display = 'none';
    }
  });
</script>

</body>
</html>
